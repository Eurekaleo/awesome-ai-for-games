name: Update star history

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the star-history chart
        run: node tools/render-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish changes when the chart advances
        run: |
          if git diff --quiet -- assets/readme/star-history-light.svg assets/readme/star-history-dark.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/star-history-light.svg assets/readme/star-history-dark.svg
          git commit -m "Update star history [skip ci]"
          git push
